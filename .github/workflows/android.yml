name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify release permissions
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          PERMISSIONS="$($AAPT2 dump permissions "$APK")"
          printf '%s\n' "$PERMISSIONS"
          test "$(printf '%s\n' "$PERMISSIONS" | grep -c '^uses-permission:')" -eq 2
          printf '%s\n' "$PERMISSIONS" | grep -q "android.permission.INTERNET"
          printf '%s\n' "$PERMISSIONS" | grep -q "android.permission.ACCESS_COARSE_LOCATION"

      - name: Upload unsigned release artifact
        uses: actions/upload-artifact@v4
        with:
          name: XiangYu-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
